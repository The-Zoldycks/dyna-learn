<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/dyna-learn-doc-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/dyna-learn-doc-icon.png" />
    <link rel="apple-touch-icon" href="/dyna-learn-doc-icon.png" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Adaptive visual knowledge diagrams and interactive AI tutoring." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dyna-learn — Interactive AI Tutor</title>
    <script>
      // Resolve the theme before first paint so a dark-mode user never gets
      // flashed a white canvas. Mirrors src/theme.js; that module stays
      // authoritative once React mounts.
      (function () {
        try {
          var saved = localStorage.getItem("dyna-theme");
          var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.background = dark ? "#0b1120" : "#fafafa";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
